name: Update profile stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate charts
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::STATS_TOKEN is not set, so the stats were not refreshed."
            exit 0
          fi
          node scripts/generate-stats.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git commit -m "Update profile stats"
          git push
